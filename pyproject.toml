[project]
name = "ruvoice"
version = "0.1.0"
description = "Русская озвучка для игр голосами оригинальных персонажей"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.32",
    "pywebview>=5.3",
    "vdf>=3.4",
    "zstandard>=0.23",  # архивы RE Engine (re_chunk_*.pak) сжаты zstd
]

[project.optional-dependencies]
# Нейросетевая часть ставится отдельно: uv sync --extra ml
ml = [
    "torch>=2.7",
    "torchaudio>=2.7",
    "numpy>=2.0",
]

[project.scripts]
ruvoice = "ruvoice.main:main"

[tool.uv]
package = true

[tool.uv.sources]
torch = [{ index = "pytorch-cu128" }]
torchaudio = [{ index = "pytorch-cu128" }]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["ruvoice"]
